name: check

# Checks the template on every change: the scripts' tests, then the template
# itself, with the hash list as main has it, so no released file is dropped.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the scripts
        run: python3 -m unittest discover -s tests

      - name: Check the template
        run: |
          git show origin/main:compose-hashes.json > "$RUNNER_TEMP/previous.json" 2> /dev/null || echo '{"released": []}' > "$RUNNER_TEMP/previous.json"
          python3 scripts/check.py --previous "$RUNNER_TEMP/previous.json"
