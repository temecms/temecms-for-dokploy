# TemeCMS for Dokploy: the template definition. Written against Dokploy
# v0.31.2 and its templates repository (blueprints/<id>/ format) as read on
# 2026-11-13. Not yet imported into a real Dokploy: see NOT-YET-PROVED.md.

[variables]
# THE ONE PLACE the image's location is set: Teme's public image, its
# permanent home. Sites keep it in TEME_IMAGE_REPOSITORY for their updates.
image_repository = "ghcr.io/temecms/teme"
# The exact Teme release, as the image is tagged (no leading "v"). Never
# "latest". Changed by scripts/bump.sh only.
teme_tag = "0.8.0-alpha.1" # teme-pin

# A random subdomain for a first try; the operator sets the real domain in
# the Domains tab and the same host in APP_URL (see README).
main_domain = "${domain}"
# Dokploy's base64 helper takes a number of BYTES, so this should be
# "base64:" plus base64 of 32 random bytes: exactly what Laravel expects.
# NOT YET PROVED on a real deploy (NOT-YET-PROVED.md, item 1).
app_key = "base64:${base64:32}"
db_password = "${password:32}"
postgres_password = "${password:32}"

[config]
env = [
  "TEME_IMAGE=${image_repository}:${teme_tag}",
  # The updater runs from its own copy of the image, so an update never
  # replaces it midway. Always set: the compose file refuses to start without it.
  "TEME_UPDATER_IMAGE=${image_repository}:${teme_tag}",
  "TEME_IMAGE_REPOSITORY=${image_repository}",
  "APP_URL=https://${main_domain}",
  "APP_KEY=${app_key}",
  "DB_PASSWORD=${db_password}",
  "POSTGRES_PASSWORD=${postgres_password}",
  # Optional: Teme's releases are public; a token only raises GitHub's limit.
  "TEME_GITHUB_TOKEN=",
  # Typed by the operator, left empty here: a template cannot make a token.
  # See the README, "Switching on the Update button".
  "TEME_DOKPLOY_URL=http://dokploy:3000",
  "TEME_DOKPLOY_COMPOSE_ID=",
  "TEME_DOKPLOY_TOKEN=",
]

[[config.domains]]
serviceName = "web"
port = 8080
host = "${main_domain}"

# No [[config.mounts]]: Teme needs no files written into containers. Its three
# volumes (pgdata, media, page-cache) are named in docker-compose.yml.
