# TemeCMS for Dokploy's template list. Every setting is filled here: the site
# needs nothing typed before its first deploy.
# Guide: https://github.com/temecms/temecms-for-dokploy

[variables]
# The release this template installs. The release step changes it.
teme_version = "1.7.1"
image_repository = "ghcr.io/temecms/teme"
# An address Dokploy makes for the server; change it on the Domains tab and
# in APP_URL to use your own.
main_domain = "${domain}"
# "base64:" and 32 random bytes, as Laravel reads an app key.
app_key = "base64:${base64:32}"
# Letters and digits only, from a secure random source.
db_password = "${hash:64}"
postgres_password = "${hash:64}"

[config]
# The Environment tab, grouped, with a comment line above each group. A comment
# is always a line of its own: a "#" after a value would become part of it.
env = [
    "# Teme's version. The Update button in the admin changes the next two lines;",
    "# don't edit them while an update runs.",
    "TEME_IMAGE=${image_repository}:${teme_version}",
    "TEME_UPDATER_IMAGE=${image_repository}:${teme_version}",
    "TEME_IMAGE_REPOSITORY=${image_repository}",
    "",
    "# The address readers type, with https. Change it, and add the domain on the",
    "# Domains tab, to use your own domain.",
    "APP_URL=https://${main_domain}",
    "",
    "# Never change these after the first deploy. The app key opens everything",
    "# Teme encrypts; the passwords open the database; the slug names the site's",
    "# data folders, so a new slug means an empty site.",
    "APP_KEY=${app_key}",
    "DB_PASSWORD=${db_password}",
    "POSTGRES_PASSWORD=${postgres_password}",
    "STACK_SLUG=${APP_NAME}",
    "",
    "# Don't edit: this is how the Update button finds this service. It must stay",
    "# the same as the App Name on the General tab.",
    "TEME_DOKPLOY_APP_NAME=${APP_NAME}",
    "",
    "# Mail. Until these are set, Teme writes its mail (password resets,",
    "# invitations, backup alerts) to its log instead of sending it. Remove the",
    "# leading # and fill in your provider's details; for port 465, also set",
    "# MAIL_SCHEME to smtps.",
    "# MAIL_MAILER=smtp",
    "# MAIL_HOST=smtp.example.com",
    "# MAIL_PORT=587",
    "# MAIL_USERNAME=",
    "# MAIL_PASSWORD=",
    "# MAIL_FROM_ADDRESS=hello@example.com",
    "# MAIL_FROM_NAME=",
]

[[config.domains]]
serviceName = "web"
port = 8080
host = "${main_domain}"
