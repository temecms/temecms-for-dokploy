<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Teme</title>
  <style>
    .tile { fill: #FFFFFF; } .edge { stroke: #DFE3E4; } .deep { fill: #0A6273; } .light { fill: #48ADC2; } .pale { fill: #8FCFDC; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1B2224; } .edge { stroke: none; } .deep { fill: #48ADC2; } .light { fill: #2A8FA3; } .pale { fill: #1F6F80; }
    }
  </style>
  <rect class="tile" width="120" height="120" rx="27"/>
  <rect class="edge" x="1" y="1" width="118" height="118" rx="26" fill="none" stroke-width="2"/>
  <rect class="light" x="24" y="40" width="26" height="18" rx="5"/>
  <rect class="deep" x="54" y="40" width="42" height="18" rx="5"/>
  <rect class="deep" x="54" y="62" width="18" height="36" rx="5"/>
  <rect class="pale" x="34" y="62" width="16" height="16" rx="4"/>
  <circle class="deep" cx="86" cy="26" r="5"/>
  <circle class="light" cx="74" cy="21" r="3.5"/>
</svg>
